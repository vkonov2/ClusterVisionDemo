version: "3.9"

services:
  llava-video-gui:
    image: llava-video-gui:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
    restart: unless-stopped
    # Uncomment the volume below to persist Hugging Face caches across runs.
    # volumes:
    #   - ./hf-cache:/root/.cache/huggingface
