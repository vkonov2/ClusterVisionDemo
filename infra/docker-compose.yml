services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - 127.0.0.1:5432:5432


  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redisdata:/data


  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000" # S3 API (публичный для браузера в DEV)
      - "9001:9001" # Консоль MinIO (админ)
    volumes:
    - minio:/data


  api:
    build:
      context: ../api
    env_file: ../.env
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "${API_PORT}:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]


  worker:
    build:
      context: ../worker
    env_file: ../.env
    depends_on:
      - redis
      - postgres
      - minio


  flower:
    image: mher/flower:2.0.1
    env_file: ../.env
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
    depends_on:
      - redis
    ports:
      - "${FLOWER_PORT}:5555"          # внутри контейнера Flower слушает 5555
    # У образа ENTRYPOINT уже = "flower". Передаём только аргументы.
    command: ["celery", "--broker=${CELERY_BROKER_URL}", "flower", "--port=5555", "--persistent=False"]



  # (Опционально) nginx, если хотите разрулить домены/API/статику сейчас
  nginx:
    image: nginx:1.27
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    ports:
      - "80:80"


volumes:
  pgdata: {}
  redisdata: {}
  minio: {}