worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;


events { worker_connections 1024; }

# === 1) Прокси фронта/SPA и API (если надо) — можно оставить как в гайде ===
http {
    server {
        listen 80;
        server_name _;


        location /api/ {
            proxy_pass http://api:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }


        # статику/landing можно положить сюда позже
        location / { return 200 'OK'; add_header Content-Type text/plain; }
}

}
# === 2) Прокси MinIO с глобальным CORS ===
server {
  listen 80;
  server_name storage.localhost;

  client_max_body_size 5g;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
  proxy_request_buffering off;

  location / {
    proxy_pass http://minio:9000;
    proxy_set_header Host $host;        # важно для подписей S3 v4
    proxy_set_header X-Real-IP $remote_addr;

    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin  $http_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, HEAD, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Origin, Accept, Authorization, x-amz-*" always;
      add_header Access-Control-Max-Age 86400 always;
      add_header Content-Length 0;
      add_header Content-Type text/plain;
      return 204;
    }
    add_header Access-Control-Allow-Origin $http_origin always;
  }
}